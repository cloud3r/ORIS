<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            background: #07131b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
        }

        a {
            color: #00c8e9;
            text-decoration: none;
        }

        .add-button {
            padding: 12px 20px;
            background: #00c8e9;
            color: #07131b;
            border-radius: 6px;
            font-weight: bold;
        }

        .add-button:hover {
            background: #35dcf5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #202328;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #34383e;
        }

        th {
            background: #292e35;
            color: #00c8e9;
        }

        tbody tr:hover {
            background: #292e35;
        }

        .card-image {
            width: 65px;
            height: auto;
            display: block;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .edit-button,
        .delete-button {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .edit-button {
            background: #00c8e9;
            color: #07131b;
        }

        .edit-button:hover {
            background: #35dcf5;
        }

        .delete-button {
            border: none;
            background: #d94355;
            color: white;
        }

        .delete-button:hover {
            background: #f05b6d;
        }

        .delete-form {
            margin: 0;
        }

        .success-message {
            display: none;
            padding: 13px 18px;
            margin-bottom: 22px;
            border: 1px solid #238b57;
            border-radius: 8px;
            background: rgba(35, 139, 87, 0.15);
            color: #55d995;
            font-size: 14px;
            font-weight: 600;
        }

        .success-message.visible {
            display: block;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #aaa;
        }

        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            .container {
                overflow-x: auto;
            }

            table {
                min-width: 850px;
            }

            .header {
                gap: 15px;
            }
        }
        .admin-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logout-button {
            padding: 10px 18px;
            border: 1px solid #ff6464;
            border-radius: 6px;
            background: transparent;
            color: #ff6464;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #ff6464;
            color: white;
        }
    </style>
</head>

<body>

<div class="admin-topbar">
    <span>CardSite — Administration</span>

    <form action="/admin/logout" method="POST">
        <button type="submit" class="logout-button">
            Выйти
        </button>
    </form>
</div>

<div class="container">

    <div id="successMessage" class="success-message">
        ✓ Карта успешно удалена!
    </div>

    <div class="header">
        <h1>Управление картами</h1>

        <a href="/admin" class="add-button">
            + Добавить карту
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Name</th>
            <th>Card number</th>
            <th>Cost</th>
            <th>Power</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        {{foreach Cards}}
        <tr>
            <td>{{Id}}</td>

            <td>
                <img class="card-image"
                     src="{{ImageUrl}}"
                     alt="{{Name}}">
            </td>

            <td>{{Name}}</td>
            <td>{{CardNumber}}</td>
            <td>{{Cost}}</td>
            <td>{{Power}}</td>

            <td>
                <div class="actions">

                    <a href="/admin/cards/edit?id={{Id}}"
                       class="edit-button">
                        Edit
                    </a>

                    <form class="delete-form"
                          action="/admin/cards/delete"
                          method="POST"
                          onsubmit="return confirmDelete('{{CardNumber}}');">

                        <input type="hidden" name="id" value="{{Id}}">

                        <button type="submit" class="delete-button">
                            Delete
                        </button>

                    </form>

                </div>
            </td>
        </tr>
        {{/foreach}}
        </tbody>
    </table>

</div>

<script>
    function confirmDelete(cardNumber) {
        return confirm(
            `Вы действительно хотите удалить карту ${cardNumber}?\n\nЭто действие нельзя отменить.`
        );
    }

    const urlParams = new URLSearchParams(window.location.search);
    const successMessage = document.getElementById("successMessage");

    if (urlParams.get("deleted") === "1") {
        successMessage.classList.add("visible");

        window.history.replaceState(
            {},
            document.title,
            "/admin/cards"
        );

        setTimeout(() => {
            successMessage.classList.remove("visible");
        }, 4000);
    }

    if (urlParams.get("success") === "1") {
        successMessage.textContent = "✓ Изменения карты успешно сохранены!";
        successMessage.classList.add("visible");

        window.history.replaceState(
            {},
            document.title,
            "/admin/cards"
        );

        setTimeout(() => {
            successMessage.classList.remove("visible");
        }, 4000);
    }
</script>

</body>
</html>
