<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — CardSite</title>

    <link rel="stylesheet" href="/css/admin.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07131b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: #202328;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #15191e;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #00c8e9;
            color: #07131b;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff6464;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h1>CardSite Admin</h1>

    <p class="error">{{ErrorMessage}}</p>

    <form action="/admin/login" method="POST">
        <label for="username">Логин</label>
        <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required>

        <label for="password">Пароль</label>
        <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

        <button type="submit">Войти</button>
    </form>
</div>

</body>
</html>
